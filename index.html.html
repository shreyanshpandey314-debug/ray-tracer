const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
let particles = [];
let animationFrame = 0;
let startTime = 0;
let currentImage = new Image();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (currentImage.complete && currentImage.naturalWidth) {
    createParticles(currentImage, false);
  }
}
window.addEventListener("resize", resize);

function loadImage(src) {
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    createParticles(img, true);
  };
  img.src = src;
}

document.getElementById("upload").addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const objectUrl = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    createParticles(img, true);
    URL.revokeObjectURL(objectUrl);
  };
  img.onerror = () => URL.revokeObjectURL(objectUrl);
  img.src = objectUrl;
});

document.getElementById("replayButton").addEventListener("click", replay);

function createParticles(img, shouldReplay) {
  const source = document.createElement("canvas");
  const sctx = source.getContext("2d", { willReadFrequently: true });
  const sw = img.naturalWidth;
  const sh = img.naturalHeight;
  source.width = sw;
  source.height = sh;
  sctx.drawImage(img, 0, 0, sw, sh);

  const pixels = sctx.getImageData(0, 0, sw, sh).data;

  // Remove only very strong, thin notebook rules. The previous detector
  // was too aggressive and could create wide empty bands in the particle image.
  const removeRow = new Uint8Array(sh);
  const rowDarkness = new Float32Array(sh);
  for (let y = 0; y < sh; y++) {
    let darkCount = 0;
    for (let x = 0; x < sw; x += 2) {
      const i = (y * sw + x) * 4;
      const gray = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
      if (gray < 125) darkCount++;
    }
    rowDarkness[y] = darkCount / Math.ceil(sw / 2);
  }

  for (let y = 1; y < sh - 1; y++) {
    const isStrongRule = rowDarkness[y] > 0.58;
    const neighborsAreLighter =
      rowDarkness[y - 1] < rowDarkness[y] * 0.72 &&
      rowDarkness[y + 1] < rowDarkness[y] * 0.72;
    if (isStrongRule && neighborsAreLighter) removeRow[y] = 1;
  }

  // Fit the complete original sketch without stretching or cropping it.
  const scale = Math.min((W * 0.94) / sw, (H * 0.76) / sh);
  const displayW = sw * scale;
  const displayH = sh * scale;
  const offsetX = (W - displayW) / 2;
  const offsetY = (H - displayH) / 2;

  particles = [];
  const step = 1;

  for (let y = 0; y < sh; y += step) {
    if (removeRow[y]) continue;
    for (let x = 0; x < sw; x += step) {
      const i = (y * sw + x) * 4;
      const gray = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];

      // Retain lighter pencil shading too, with a dense base particle coverage.
      if (gray > 218) continue;
      const darkness = Math.max(0, Math.min(1, (218 - gray) / 165));
      const probability = 0.58 + darkness * 0.42;
      if (Math.random() > probability) continue;

      particles.push({
        tx: offsetX + x * scale,
        ty: offsetY + y * scale,
        x: Math.random() * W,
        y: H + Math.random() * H,
        delay: (offsetY + y * scale) / H * 1500 + Math.random() * 220,
        size: 0.42 + darkness * 0.78,
        alpha: 0.42 + darkness * 0.58
      });
    }
  }

  if (shouldReplay) replay();
  else drawFinal();
}

function ease(t) { return 1 - Math.pow(1 - t, 3); }

function replay() {
  if (!particles.length) return;
  cancelAnimationFrame(animationFrame);
  for (const p of particles) {
    p.x = p.tx + (Math.random() - 0.5) * W * 0.85;
    p.y = H + Math.random() * H;
  }
  startTime = performance.now();
  animationFrame = requestAnimationFrame(animate);
}

function animate(now) {
  const elapsed = now - startTime;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    const progress = Math.max(0, Math.min(1, (elapsed - p.delay) / 1550));
    const t = ease(progress);
    const x = p.x + (p.tx - p.x) * t;
    const y = p.y + (p.ty - p.y) * t;
    ctx.globalAlpha = p.alpha * (0.22 + t * 0.78);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (elapsed < 5200) animationFrame = requestAnimationFrame(animate);
  else drawFinal();
}

function drawFinal() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(p.tx, p.ty, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

resize();
loadImage(DEFAULT_IMAGE);
</script>
